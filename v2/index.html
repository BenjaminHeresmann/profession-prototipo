<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PROFESSION v2</title>
<script>if(new URLSearchParams(location.search).has('reset')){try{localStorage.clear();sessionStorage.clear();}catch(e){}location.replace(location.pathname);}</script>
<style>
:root{
  --navy:#1F3A5F; --navy-d:#16294a; --gold:#C9A14A; --gold-l:#F4E8CE;
  --green:#2E7D46; --green-l:#E7F3EB; --bg:#F7F8FA; --card:#FFFFFF;
  --text:#1c2733; --muted:#6b7686; --line:#E5E8EE; --red:#C0392B; --red-l:#FBEAE8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--navy-d);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text)}
#app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media(min-width:500px){#app{margin:16px auto;min-height:calc(100dvh - 32px);border-radius:24px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}}
.screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;padding-bottom:76px}
.header{background:var(--navy);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
.header h1{font-size:22px;font-weight:800}
.header .sub{font-size:13px;opacity:.85;margin-top:2px}
.hrow{display:flex;align-items:center;gap:10px}
.back{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;flex:none}
.content{padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card.gold{border-color:var(--gold)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;width:100%;font-family:inherit}
.btn.primary{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn.danger-ghost{background:transparent;color:var(--red);border:1.5px solid var(--red-l)}
.btn:disabled{opacity:.45;cursor:default}
.tabs{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;z-index:10}
@media(min-width:500px){.tabs{bottom:16px;border-radius:0 0 24px 24px}}
.tab{flex:1;padding:9px 4px 10px;text-align:center;font-size:11px;color:var(--muted);cursor:pointer;font-weight:600}
.tab .ico{font-size:20px;display:block;margin-bottom:2px}
.tab.on{color:var(--navy)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.chip.ok{background:var(--green-l);color:var(--green)} .chip.warn{background:var(--gold-l);color:#8a6d2a}
.chip.info{background:#E8EDF5;color:var(--navy)} .chip.bad{background:var(--red-l);color:var(--red)}
.badge-v{position:fixed;top:8px;right:8px;z-index:99;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:2px 8px;border-radius:99px;cursor:pointer}
.avatar{width:46px;height:46px;border-radius:50%;background:repeating-linear-gradient(45deg,#e8ebf0,#e8ebf0 6px,#f4f6f9 6px,#f4f6f9 12px);border:2px solid var(--gold);flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy)}
.stars{color:var(--gold);letter-spacing:1px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;cursor:pointer}
.cat .ico{width:38px;height:38px;border-radius:10px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.cat span{font-size:12.5px;font-weight:600}
input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-size:16px;font-family:inherit;background:#fff;color:var(--text)}
input:focus,textarea:focus{outline:none;border-color:var(--navy)}
label{font-size:13px;font-weight:700;margin-bottom:5px;display:block}
.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:rgba(20,25,35,.92);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:100;white-space:nowrap;transition:opacity .3s}
.divider{height:1px;background:var(--line);margin:2px 0}
.section-t{font-size:16px;font-weight:800;margin-top:4px}
.money{color:var(--green);font-weight:800}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.switch{width:44px;height:26px;border-radius:99px;background:#cfd6df;position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch.on{background:var(--green)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on::after{left:21px}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
.bubble{max-width:80%;padding:10px 13px;border-radius:14px;font-size:15px;line-height:1.35}
.bubble.me{background:var(--gold-l);align-self:flex-end;border-bottom-right-radius:4px}
.bubble.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.btime{font-size:10.5px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<div id="app"></div>
<div class="badge-v" onclick="go('changelog')">v2 · iter 5</div>
<script>
/* ============ PROFESSION v2 — SPA propia, extensible ============ */
/* Estado global persistente */
var S = {};
try { S = JSON.parse(localStorage.getItem('pv2') || '{}'); } catch(e) {}
function save() { try { localStorage.setItem('pv2', JSON.stringify(S)); } catch(e) {} }
S.screen = S.screen || 'rol';
S.notifRead = S.notifRead || false;
S.prefs = S.prefs || { push: true, sms: true, mail: false };

var $ = function(html) { return html; };
function fmt(n) { return '$' + (n || 0).toLocaleString('es-CL'); }

/* ---- Datos mock (extensibles en próximas iteraciones) ---- */
var CATS = [
  { k: 'gasfiteria', n: 'Gasfitería', c: '#3E6B8F' }, { k: 'electricidad', n: 'Electricidad', c: '#C9A14A' },
  { k: 'limpieza', n: 'Limpieza', c: '#4C8F6B' }, { k: 'carpinteria', n: 'Carpintería', c: '#8F6B4C' },
  { k: 'jardineria', n: 'Jardinería', c: '#5F8F3E' }, { k: 'pintura', n: 'Pintura', c: '#7A5F9E' }
];
var PROS = [
  { id: 1, n: 'Roberto Díaz', cat: 'Carpintería', exp: '10+ años', jobs: 238, rating: 4.9, op: 112, km: 1.2, desde: 20000, hoy: true },
  { id: 2, n: 'Luis Contreras', cat: 'Carpintería', exp: '6 años', jobs: 94, rating: 4.7, op: 61, km: 2.8, desde: 18000, hoy: false },
  { id: 3, n: 'Patricia Muñoz', cat: 'Limpieza', exp: '8 años', jobs: 150, rating: 4.8, op: 87, km: 3.5, desde: 15000, hoy: true }
];
var MY_SERVICES = [
  { id: 4218, t: 'Puerta de closet', pro: 'Roberto Díaz', estado: 'Confirmado', tipo: 'ok', fecha: 'Hoy, 15:00', monto: 37500 },
  { id: 4102, t: 'Lavado de auto', pro: 'Patricia Muñoz', estado: 'Finalizado', tipo: 'info', fecha: '28/07', monto: 25000 }
];
var CHATS_A = [
  { id: 1, n: 'Roberto Díaz', last: 'Voy en camino, llego 15:00 en punto.', t: '14:12', unread: 1 },
  { id: 3, n: 'Patricia Muñoz', last: 'Gracias por la evaluación 🙌', t: 'Ayer', unread: 0 }
];
var NOTIFS = [
  { tipo: 'ok', t: 'Precio confirmado', d: 'Confirmaste $37.500 por "Puerta de closet". Contrato cerrado.', when: 'Hoy 10:41' },
  { tipo: 'info', t: 'Roberto está en camino', d: 'Llega aprox. 15:00 a Av. Irarrázaval 3421.', when: 'Hoy 14:12' },
  { tipo: 'warn', t: 'Evalúa tu servicio', d: 'Tienes 48 hrs para evaluar "Lavado de auto".', when: '28/07' }
];

/* ---- Router ---- */
function go(screen, param) {
  S.screen = screen; S.param = param; save();
  render();
  var sc = document.querySelector('.screen'); if (sc) sc.scrollTop = 0;
  window.scrollTo(0, 0);
}
function toast(msg) {
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(function(){ t.style.opacity = 0; }, 1800);
  setTimeout(function(){ t.remove(); }, 2200);
}

/* ---- Componentes ---- */
function header(title, sub, backTo) {
  return '<div class="header"><div class="hrow">' +
    (backTo ? '<div class="back" onclick="go(\'' + backTo + '\')">‹</div>' : '') +
    '<div class="grow"><h1>' + title + '</h1>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div></div></div>';
}
function tabsA(on) {
  var t = [['a_home','🏠','Inicio'],['a_servicios','🧾','Mis servicios'],['a_chats','💬','Mensajes'],['a_cuenta','👤','Mi cuenta']];
  return '<div class="tabs">' + t.map(function(x){
    return '<div class="tab' + (on === x[0] ? ' on' : '') + '" onclick="go(\'' + x[0] + '\')"><span class="ico">' + x[1] + '</span>' + x[2] + '</div>';
  }).join('') + '</div>';
}
function tabsB(on) {
  var t = [['b_panel','📋','Panel'],['b_agenda','📅','Agenda'],['b_chats','💬','Mensajes'],['b_perfil','👤','Perfil']];
  return '<div class="tabs">' + t.map(function(x){
    return '<div class="tab' + (on === x[0] ? ' on' : '') + '" onclick="go(\'' + x[0] + '\')"><span class="ico">' + x[1] + '</span>' + x[2] + '</div>';
  }).join('') + '</div>';
}
function proCard(p) {
  return '<div class="card gold row" onclick="go(\'a_pro\',' + p.id + ')" style="cursor:pointer">' +
    '<div class="avatar">' + p.n.split(' ').map(function(w){return w[0];}).join('') + '</div>' +
    '<div class="grow"><b>' + p.n + ' <span style="color:var(--gold)">✔</span></b>' +
    '<div class="muted">' + p.cat + ' · ' + p.exp + '</div>' +
    '<div class="muted"><span class="stars">★</span> ' + p.rating + ' (' + p.op + ') · a ' + p.km + ' km · desde <b>' + fmt(p.desde) + '</b></div></div>' +
    '<span class="chip ' + (p.hoy ? 'ok' : 'warn') + '">' + (p.hoy ? 'Hoy' : 'Mañana') + '</span></div>';
}

/* ---- Pantallas ---- */
var SCREENS = {

rol: function() {
  return '<div class="screen" style="background:var(--navy);justify-content:center;padding:24px">' +
  '<div style="text-align:center;color:#fff;margin-bottom:28px">' +
  '<div style="width:84px;height:84px;border-radius:22px;background:#fff;color:var(--navy);font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 14px">P</div>' +
  '<h1 style="letter-spacing:2px">PROFESSION</h1>' +
  '<div style="width:44px;height:3px;background:var(--gold);margin:10px auto"></div>' +
  '<div style="opacity:.85;font-size:14px">El profesionalismo no es un título,<br>es cómo se hace cada tarea.</div></div>' +
  '<div style="display:flex;flex-direction:column;gap:12px">' +
  '<div class="card gold" style="cursor:pointer" onclick="go(\'a_home\')"><div class="row"><span style="font-size:26px">🔍</span><div class="grow"><b>Quiero solicitar un servicio</b><div class="muted">Encuentra maestros verificados cerca tuyo</div></div><span style="color:var(--gold);font-size:20px">›</span></div></div>' +
  '<div class="card gold" style="cursor:pointer" onclick="go(S.regDone?\'b_panel\':\'b_reg1\')"><div class="row"><span style="font-size:26px">🛠</span><div class="grow"><b>Quiero trabajar con PROFESSION</b><div class="muted">Recibe trabajos cercanos y cobra seguro</div></div><span style="color:var(--gold);font-size:20px">›</span></div></div>' +
  '<div style="text-align:center;color:#fff;opacity:.7;font-size:12.5px;margin-top:6px">Para trabajar necesitarás verificar tu identidad.</div></div></div>';
},

/* ===== FLUJO CLIENTE ===== */
a_home: function() {
  return '<div class="screen">' +
  '<div class="header"><div class="hrow"><div class="back" onclick="go(\'rol\')">‹</div><div class="grow">' +
  '<div class="sub">Hola, Camila 👋</div><h1>¿Qué necesitas hoy?</h1></div>' +
  '<div style="position:relative;cursor:pointer" onclick="go(\'a_notifs\')"><span style="font-size:22px">🔔</span>' +
  (S.notifRead ? '' : '<span class="notif-dot" style="position:absolute;top:0;right:0"></span>') + '</div></div>' +
  '<div style="margin-top:12px"><input id="q" placeholder="🔎 Buscar oficio, ej: gasfitería" value="' + (S.q || '') + '" oninput="S.q=this.value;save();qFilter()"></div></div>' +
  '<div class="content">' +
  '<div class="section-t">Oficios</div><div class="grid3" id="catgrid">' +
  CATS.map(function(c){ return '<div class="cat" data-n="' + c.n.toLowerCase() + '" onclick="go(\'a_lista\',\'' + c.n + '\')"><div class="ico" style="background:' + c.c + '22;color:' + c.c + '">' + c.n[0] + '</div><span>' + c.n + '</span></div>'; }).join('') + '</div>' +
  '<div id="qempty" style="display:none" class="card"><div style="text-align:center"><b>Sin resultados para tu búsqueda</b><div class="muted" style="margin:6px 0 12px">Prueba con otro término o publica tu solicitud describiendo lo que necesitas.</div><button class="btn primary" onclick="go(\'a_publicar\')">Publicar solicitud</button></div></div>' +
  '<div class="card" style="background:var(--navy);color:#fff"><div class="row"><div class="grow"><b>¿No sabes qué oficio necesitas?</b><div style="font-size:13px;opacity:.85">Publica tu solicitud y recibe propuestas.</div></div><button class="btn gold" style="width:auto;padding:10px 18px" onclick="go(\'a_publicar\')">Publicar</button></div></div>' +
  '<div class="section-t">Cerca de ti</div>' + PROS.slice(0,2).map(proCard).join('') +
  '</div>' + tabsA('a_home') + '</div>';
},

a_lista: function() {
  var cat = S.param || 'Carpintería';
  var list = PROS.filter(function(p){ return p.cat === cat; });
  if (!list.length) list = PROS;
  return '<div class="screen">' + header(cat, list.length + ' disponibles cerca de Ñuñoa', 'a_home') +
  '<div class="content">' +
  '<div class="row" style="gap:8px"><span class="chip info">Más cercanos ▾</span><span class="chip warn">★ 4,5+</span><span class="chip ok">Hoy</span></div>' +
  list.map(proCard).join('') +
  '<div class="card" style="background:var(--navy);color:#fff"><div class="row"><div class="grow"><b>¿Prefieres recibir propuestas?</b><div style="font-size:13px;opacity:.85">Publica tu solicitud y los maestros postulan.</div></div><button class="btn gold" style="width:auto;padding:10px 18px" onclick="go(\'a_publicar\')">Publicar</button></div></div>' +
  '</div>' + tabsA('a_home') + '</div>';
},

a_pro: function() {
  var p = PROS.filter(function(x){ return x.id === S.param; })[0] || PROS[0];
  return '<div class="screen">' + header(p.n + ' ✔', p.cat + ' · Ñuñoa, Santiago', 'a_home') +
  '<div class="content">' +
  '<div class="card gold"><div class="row"><div class="avatar" style="width:64px;height:64px;font-size:20px">' + p.n.split(' ').map(function(w){return w[0];}).join('') + '</div>' +
  '<div class="grow"><span class="chip ok">✔ Verificado</span><div class="stars" style="margin-top:4px">★★★★★ <b style="color:var(--text)">' + p.rating + '</b> <span class="muted">(' + p.op + ' opiniones)</span></div></div></div>' +
  '<div class="grid3" style="margin-top:12px;text-align:center">' +
  '<div><b>' + p.exp + '</b><div class="muted">experiencia</div></div>' +
  '<div><b>' + p.jobs + '</b><div class="muted">trabajos</div></div>' +
  '<div><b>98%</b><div class="muted">a tiempo</div></div></div></div>' +
  '<div class="section-t">Galería de trabajos</div>' +
  '<div class="grid2">' + [1,2,3,4].map(function(){ return '<div style="height:90px;border-radius:12px;background:repeating-linear-gradient(45deg,#e8ebf0,#e8ebf0 8px,#f4f6f9 8px,#f4f6f9 16px);border:1px solid var(--line);display:flex;align-items:center;justify-content:center" class="muted">foto</div>'; }).join('') + '</div>' +
  '<div class="section-t">Opiniones</div>' +
  '<div class="card"><div class="stars">★★★★★</div><div style="font-size:14px;margin:4px 0">"Impecable, puntual y muy ordenado. Volvería a contratarlo."</div><div class="muted">Marcela V. · Providencia · 04/08/26</div></div>' +
  '<div class="card"><div class="stars">★★★★☆</div><div style="font-size:14px;margin:4px 0">"Buen trabajo, llegó con algo de atraso pero avisó."</div><div class="muted">Jorge P. · Macul · 30/03/26</div></div>' +
  '<button class="btn primary" onclick="if(!S.sol){S.sol={t:\'Puerta de closet\',oficio:\'Carpintería\',estado:\'Negociando\'};save()}go(\'a_nego\',1)">Contactar y pedir precio</button>' +
  '<button class="btn ghost" onclick="go(\'a_agendar\',' + p.id + ')">Programar servicio</button>' +
  '</div>' + tabsA('a_home') + '</div>';
},

a_publicar: function() {
  var pre = S.param && typeof S.param === 'string' ? S.param : 'Carpintería';
  S.urgSel = S.urgSel === undefined ? 0 : S.urgSel;
  var urgs = [['bad','Urgente, hoy'],['warn','Esta semana'],['info','Flexible']];
  return '<div class="screen">' + header('Publicar solicitud', null, 'a_home') +
  '<div class="content">' +
  '<div><label>Oficio</label><select id="f_oficio">' + CATS.map(function(c){ return '<option' + (c.n === pre ? ' selected' : '') + '>' + c.n + '</option>'; }).join('') + '</select></div>' +
  '<div><label>¿Qué necesitas?</label><textarea id="f_desc" rows="3" placeholder="Describe el problema con detalle...">' + (S.fDesc || 'Reparar puerta de closet descolgada, es de riel. Dormitorio principal.') + '</textarea></div>' +
  '<div><label>Ubicación</label><input id="f_ubi" value="Av. Irarrázaval 3421, Ñuñoa"></div>' +
  '<div><label>¿Para cuándo?</label><div class="row" style="gap:8px">' +
  urgs.map(function(u, i){ return '<span class="chip ' + (S.urgSel === i ? u[0] : 'info') + '" style="cursor:pointer;' + (S.urgSel === i ? 'outline:2px solid var(--navy)' : 'opacity:.6') + '" onclick="S.urgSel=' + i + ';save();render()">' + u[1] + '</span>'; }).join('') + '</div></div>' +
  '<div><label>Presupuesto referencial (opcional)</label><input id="f_ref" inputmode="numeric" value="30.000" onfocus="this.select()"></div>' +
  '<button class="btn primary" onclick="pubSol()">Publicar solicitud</button>' +
  '</div>' + tabsA('a_home') + '</div>';
},

a_propuestas: function() {
  var sol = S.sol || {};
  var props = [
    { id: 1, n: 'Roberto Díaz', r: 4.9, op: 112, km: 1.2, cuando: 'puede hoy', monto: 37500, msg: '"Puedo ir hoy en la tarde. El riel probablemente hay que cambiarlo, lo confirmo al verlo."' },
    { id: 2, n: 'Luis Contreras', r: 4.7, op: 61, km: 2.8, cuando: 'mañana', monto: 25000, msg: null },
    { id: 3, n: 'Patricia Muñoz', r: 4.8, op: 87, km: 3.5, cuando: 'esta semana', monto: 32000, msg: null }
  ];
  return '<div class="screen">' + header('Propuestas', (sol.t || 'Solicitud') + ' · #4219', 'a_servicios') +
  '<div class="content">' +
  '<div class="muted">3 maestros postularon' + (sol.ref ? ' · tu ref: ' + fmt(sol.ref) : '') + '</div>' +
  props.map(function(p, i){
    return '<div class="card' + (i === 0 ? ' gold' : '') + '">' +
    '<div class="row"><div class="avatar">' + p.n.split(' ').map(function(w){return w[0];}).join('') + '</div>' +
    '<div class="grow"><b>' + p.n + ' <span style="color:var(--gold)">✔</span></b>' +
    '<div class="muted"><span class="stars">★</span> ' + p.r + ' (' + p.op + ') · a ' + p.km + ' km · ' + p.cuando + '</div></div>' +
    '<div style="text-align:right"><span class="money" style="font-size:17px">' + fmt(p.monto) + '</span><div class="muted" style="font-size:11px">monto inicial</div></div></div>' +
    (p.msg ? '<div style="font-size:14px;margin:8px 0 2px;font-style:italic">' + p.msg + '</div>' : '') +
    '<div class="row" style="margin-top:10px;gap:8px"><button class="btn primary" style="padding:11px" onclick="go(\'a_nego\',' + p.id + ')">Abrir chat</button><button class="btn ghost" style="padding:11px" onclick="go(\'a_pro\',' + p.id + ')">Ver perfil</button></div></div>';
  }).join('') +
  '<div class="card" style="background:#E8EDF5"><span style="font-size:14px">El monto inicial es referencial: el precio final se acuerda por chat y se confirma antes de pagar.</span></div>' +
  '</div>' + tabsA('a_servicios') + '</div>';
},

/* ---- Búsqueda home ---- */
function qFilter() {
  var q = (S.q || '').toLowerCase().trim();
  var any = false;
  var cards = document.querySelectorAll('#catgrid .cat');
  for (var i = 0; i < cards.length; i++) {
    var show = !q || cards[i].getAttribute('data-n').indexOf(q) !== -1;
    cards[i].style.display = show ? '' : 'none';
    if (show) any = true;
  }
  var empty = document.getElementById('qempty');
  if (empty) empty.style.display = (q && !any) ? '' : 'none';
}

/* ---- Registro profesional ---- */
function rutOk(v) {
  var c = (v || '').replace(/[.\-\s]/g, '').toUpperCase();
  if (c.length < 8) return false;
  var body = c.slice(0, -1), dv = c.slice(-1);
  if (!/^\d+$/.test(body)) return false;
  var sum = 0, mul = 2;
  for (var i = body.length - 1; i >= 0; i--) { sum += parseInt(body[i], 10) * mul; mul = mul === 7 ? 2 : mul + 1; }
  var res = 11 - (sum % 11);
  var dvCalc = res === 11 ? '0' : res === 10 ? 'K' : String(res);
  return dv === dvCalc;
}
function rutLive(v) {
  var ok = rutOk(v);
  document.getElementById('rutmsg').innerHTML = v ? (ok ? '<span class="chip ok">✓ RUT válido</span>' : '<span class="chip bad">RUT incompleto o inválido</span>') : '';
  document.getElementById('rutbtn').disabled = !ok;
}

/* ---- Acciones del flujo de solicitud ---- */
function pubSol() {
  var desc = (document.getElementById('f_desc') || {}).value || '';
  var refRaw = ((document.getElementById('f_ref') || {}).value || '').replace(/[^0-9]/g, '');
  S.fDesc = desc;
  S.sol = {
    t: desc.length > 3 ? (desc.split(',')[0].slice(0, 32)) : 'Nueva solicitud',
    oficio: (document.getElementById('f_oficio') || {}).value || 'Carpintería',
    desc: desc,
    ref: refRaw ? parseInt(refRaw, 10) : null,
    estado: 'Negociando'
  };
  save();
  toast('Solicitud publicada — 3 maestros postularon');
  go('a_propuestas');
}
function finishSol() {
  if (S.sol) { S.sol.estado = 'Finalizado'; }
  S.lastRating = S.rating; S.rating = 0; S.ratingComment = '';
  save();
  toast('Pago de $37.500 liberado a Roberto ✓');
  go('a_servicios');
}

function render() {
  var fn = SCREENS[S.screen] || SCREENS.rol;
  document.getElementById('app').innerHTML = fn();
}
render();
